name: Contextra Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/soumyasurana

jobs:
  ci:
    name: Rust CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  publish:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/soumyasurana/contextra-gateway:latest
            ghcr.io/soumyasurana/contextra-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/soumyasurana/contextra-worker:latest
            ghcr.io/soumyasurana/contextra-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/soumyasurana/contextra-web:latest
            ghcr.io/soumyasurana/contextra-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd ~/Contextra

            git fetch origin
            git reset --hard origin/main

            cd deployments/docker

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
                -u "${{ secrets.GHCR_USERNAME }}" \
                --password-stdin

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f