[package]
name = "drex-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Drex's tool system for discovering and executing capabilities"

[dependencies]
# Core async runtime
async-trait.workspace = true
tokio.workspace = true

# Serialization (for structured inputs/outputs)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Utility
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7", "serde"] }
url = { version = "2.5", features = ["serde"] }

# HTTP client for web.fetch
reqwest.workspace = true

# Logging - important for audit trail
tracing.workspace = true

# Drex dependencies
drex-config = { path = "../drex-config" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
