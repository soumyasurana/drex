[package]
name = "drex-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
drex-core = { path = "../drex-core" }
drex-config = { path = "../drex-config" }
drex-agent = { path = "../drex-agent" }

# Async runtime
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Image processing
image = { version = "0.25", optional = true }

# Screen capture
# Using screenshots or xcap for cross-platform screen capture
# These require system dependencies so make them optional
screenshots = { version = "0.8", optional = true }
xcap = { version = "0.4", optional = true }
anyhow = { version = "1.0", optional = true }

# HTTP client for Ollama vision API
reqwest = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
regex = { workspace = true, optional = true }

# Linux X11 capture (pure Rust, no native deps)
x11rb = { version = "0.14", features = ["image"], optional = true }
flate2 = { version = "1.0", optional = true }
crc32fast = { version = "1.4", optional = true }

# Computer control (non-blocking async)
enigo = { version = "0.6", features = ["x11rb"], optional = true }

[features]
default = ["vision"]
# Full vision support requires system dependencies
vision = ["image", "screenshots", "xcap", "anyhow", "reqwest", "base64", "regex", "x11rb", "flate2", "crc32fast", "enigo"]
# Computer control without vision features
control = ["enigo"]

[lints]
workspace = true

[dev-dependencies]
enigo = "0.6.1"
