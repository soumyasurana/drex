# Drex Default Configuration
# This file is checked into git and contains no secrets.
# Override these values via environment-specific files or environment variables.
# 
# This configuration aligns with Contextra's infrastructure expectations:
# - PostgreSQL: postgres:postgrespassword@localhost:5432
# - Redis: localhost:6379

app_name = "drex"
environment = "development"
log_level = "info"

[database]
# Aligned with Contextra's docker-compose credentials for shared local development
url = "postgres://postgres:postgrespassword@localhost:5432/drex"
max_connections = 10

[redis]
# Standard Redis connection, aligned with Contextra's docker-compose
url = "redis://localhost:6379"

[ollama]
# Ollama local LLM server configuration
base_url = "http://localhost:11434"
default_model = "gemma3:4b"
timeout_seconds = 120

[contextra]
# Contextra memory gateway configuration
# The Contextra Gateway provides persistent memory and context services
# Note: Contextra's default port is 8080 (see Contextra/configs/default.toml)
gateway_url = "http://localhost:8080"
api_key = ""
timeout_seconds = 30

[qdrant]
# Qdrant vector database configuration
# Used directly by Drex for semantic memory when Contextra is not available
# NOTE: qdrant-client crate uses gRPC protocol (port 6334), not REST API (port 6333)
url = "http://localhost:6334"
api_key = ""
