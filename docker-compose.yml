# Drex + Contextra Unified Local Development Infrastructure
#
# This compose file provides the complete infrastructure stack for local Drex development.
#
# Services:
#   - PostgreSQL 16: State persistence (Drex + Contextra shared)
#   - Redis 7: Caching, sessions, pub/sub
#   - Qdrant: Vector database for semantic memory
#
# Contextra Gateway must be run separately using:
#   cd Contextra && cargo run -p gateway
#
# Or build and use the Docker image:
#   cd Contextra && docker build -f deployments/docker/Dockerfile.gateway -t contextra-gateway .
#
# Usage:
#   docker compose up -d          # Start infrastructure
#   cd Contextra && cargo run -p gateway  # Start Contextra (separate terminal)
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and remove data volumes

services:
  # PostgreSQL: Shared database for Drex and Contextra
  postgres:
    image: postgres:16-alpine
    container_name: drex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: drex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drex-network

  # Redis: Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: drex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drex-network

  # Qdrant: Vector database for semantic memory
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: drex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # HTTP API
      - "6334:6334"    # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drex-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  drex-network:
    driver: bridge
